<mat-card class="dashboard-card">
  <mat-card-header>
    <mat-card-title>PI2 Sensor Dashboard</mat-card-title>
    <mat-card-subtitle>Live sensor data from Raspberry Pi 2</mat-card-subtitle>
  </mat-card-header>
  <div class="timer-container">
    <div class="digital-clock">
      <div [class.blink]="isBlinking">{{ displayTime }}</div>
    </div>
  </div>
  <button (click)="start_timer()" class="start-timer-btn">Start timer</button>
  <mat-card-content>
    <table mat-table [dataSource]="sensorData | keyvalue" class="mat-elevation-z2">
      <ng-container matColumnDef="sensor">
        <th mat-header-cell *matHeaderCellDef>Sensor</th>
        <td mat-cell *matCellDef="let element">{{ element.value.sensor }}</td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Value</th>
        <td mat-cell *matCellDef="let element">{{ element.value.value }}</td>
      </ng-container>
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef>Timestamp</th>
        <td mat-cell *matCellDef="let element">{{ element.value.timestamp }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['sensor', 'value', 'timestamp']"></tr>
      <tr mat-row *matRowDef="let _; columns: ['sensor', 'value', 'timestamp'];"></tr>
    </table>
  </mat-card-content>
</mat-card>
<mat-card style="margin-top: 32px;">
  <mat-card-header>
    <mat-card-title>PI1 Grafana Dashboard</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <iframe
      src="http://localhost:3000/d/adk82vw?orgId=1&refresh=10s"
      width="100%"
      height="1200"
      style="border-radius:8px; margin-top:12px;"
      allowfullscreen>
    </iframe>
  </mat-card-content>
</mat-card>
