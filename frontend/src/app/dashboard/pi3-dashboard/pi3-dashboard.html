<mat-card class="dashboard-card">
  <mat-card-header>
    <mat-card-title>PI3 Sensor Dashboard</mat-card-title>
    <mat-card-subtitle>Live sensor data from Raspberry Pi 3</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="rgb-controls">
      <!-- <div>
        <label>R</label>
        <input type="range" min="0" max="255" [(ngModel)]="r" /> {{r}}
      </div>
      <div>
        <label>G</label>
        <input type="range" min="0" max="255" [(ngModel)]="g" /> {{g}}
      </div>
      <div>
        <label>B</label>
        <input type="range" min="0" max="255" [(ngModel)]="b" /> {{b}}
      </div> -->

      <div class="preset-buttons">
        <!-- <button mat-raised-button color="primary" (click)="setColorPreset(255,0,0)">Red</button>
        <button mat-raised-button color="primary" (click)="setColorPreset(0,255,0)">Green</button>
        <button mat-raised-button color="primary" (click)="setColorPreset(0,0,255)">Blue</button> -->
        <button mat-raised-button color="primary" (click)="setColorPresetByName('red')">Red</button>
        <button mat-raised-button color="primary" (click)="setColorPresetByName('green')">Green</button>
        <button mat-raised-button color="primary" (click)="setColorPresetByName('blue')">Blue</button>
        <button mat-raised-button color="accent" (click)="sendRgb()">Send</button>
      </div>
        <div class="current-color" style="margin-bottom:12px; display:flex; align-items:center; gap:8px;">
        <strong>Current LED color:</strong>
        <div class="swatch" [style.background]="'rgb(' + r + ',' + g + ',' + b + ')'" style="width:28px; height:20px; border:1px solid #ccc"></div>
      </div>
    </div>

    <table mat-table [dataSource]="sensorData | keyvalue" class="mat-elevation-z2">
      <ng-container matColumnDef="sensor">
        <th mat-header-cell *matHeaderCellDef>Sensor</th>
        <td mat-cell *matCellDef="let element">{{ element.value.sensor }}</td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Value</th>
        <td mat-cell *matCellDef="let element">{{ element.value.value }}</td>
      </ng-container>
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef>Timestamp</th>
        <td mat-cell *matCellDef="let element">{{ element.value.timestamp }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['sensor', 'value', 'timestamp']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['sensor', 'value', 'timestamp'];"></tr>
    </table>
  </mat-card-content>
</mat-card>
