<h1>Dashboards</h1>

<hr />
<h2>Alarm state: {{state==null ? 'UNKNOWN' : state?.alarm_status}}</h2>
<div class="dashboard-list">
  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>PI1 Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Live sensor data from Raspberry Pi 1.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" routerLink="/pi1-dashboard">View</button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>PI2 Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Live sensor data from Raspberry Pi 2.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" routerLink="/pi2-dashboard">View</button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>PI3 Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Live sensor data from Raspberry Pi 3.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary">View</button>
    </mat-card-actions>
  </mat-card>
</div>
